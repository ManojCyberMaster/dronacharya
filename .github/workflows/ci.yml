# CI — GitHub Actions (also runs unmodified on compatible self-hosted runners).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install
        run: |
          ~/.local/bin/uv venv
          ~/.local/bin/uv pip install -e ".[server,dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Import smoke
        run: .venv/bin/python -c "import dronacharya.cli, dronacharya.server.app"
      - name: Dependency audit
        run: |
          ~/.local/bin/uv pip install pip-audit
          .venv/bin/pip-audit --strict || true   # advisory
      - name: License policy (no AGPL/GPL/SSPL)
        run: |
          .venv/bin/pip-licenses --fail-on 'GPL;AGPL;SSPL' \
            --ignore-packages pip setuptools || true
