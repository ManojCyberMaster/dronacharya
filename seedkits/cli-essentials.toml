# ============================================================================
# Command-line essentials — seed knowledge base sources
# Curated 2026-08-16. One page per URL; `dc seed build` fetches exactly these
# (no crawling). Build docs: docs/seed-kits.md
#
# VERIFIED BY FETCHING at curation time (HTTP 200 + real server-rendered
# content): ubuntu.com package-management, debian.org ch02, Fedora dnf
# quick-docs, Rocky dnf guide, Alpine wiki apk, Tiny Core wiki/site pages,
# Arch Wiki Pacman, doc.opensuse.org zypper, GNU coreutils/bash/grep/tar/make
# manual pages, systemd systemctl, man.openbsd.org ssh, rsync man page,
# man7.org find, Ubuntu CronHowto, git-scm gittutorial + Pro Git chapter,
# python venv tutorial, pip getting-started, uv projects guide, pipx,
# docker run reference, and the Microsoft Learn WSL/cmd/PowerShell/winget/
# Terminal pages. Unverified URLs follow patterns confirmed by a verified
# sibling on the same site (GNU html_node pages, Arch Wiki /title/ pages,
# Microsoft Learn windows-commands/<cmd>, git-scm.com/docs/<cmd>, man7.org,
# systemd man pages).
#
# GAPS / CAVEATS:
# - en.opensuse.org (SDB:Zypper_usage) returns 403 to curl (bot challenge);
#   replaced with doc.opensuse.org (GFDL 1.2, curl-friendly, verified).
# - wiki.archlinux.org and docs.fedoraproject.org sit behind Anubis, which
#   blocks browser-like bot user agents but passes plain curl (verified 200).
# - Tiny Core Linux site/wiki state no explicit content license ->
#   redistributable = false (user-build-only).
# - Pro Git book chapters are CC BY-NC-SA 3.0 (NC clause) ->
#   redistributable = false (user-build-only). git-scm.com/docs man pages are
#   GPLv2 and are the redistributable alternative.
# - GFDL / CC BY-SA / GPL sources allow derivatives but are copyleft:
#   redistribution of distilled units must carry attribution + same license.
# - man7.org: only pages with known-free upstream licenses are included
#   (findutils GPL-3, util-linux GPL-2, iproute2 GPL-2, cronie ISC,
#   shadow-utils BSD-3). Other man7 pages may use the Linux-man-pages
#   "verbatim" license (no derivatives) — do not add more without checking.
# ============================================================================

