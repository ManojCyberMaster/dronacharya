[project]
name = "dronacharya"
version = "0.1.0"
description = "DronaCharya — personal knowledge management with a local RAG. Save pages and notes, distill knowledge, find it again."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
    "trafilatura>=1.8",          # Apache-2.0 from 1.8 — do not unpin below
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "numpy>=1.26",               # imported directly (tagmap); pin it explicitly
    "pypdf>=4.0",
    "langdetect>=1.0.9",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",                # expose your KB to any MCP client
]
server = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pg8000>=1.31",            # Postgres driver (BSD, pure Python)
    "python-multipart>=0.0.9", # file uploads (MIT)
]
dev = [
    "pytest>=8.0",
    "pip-licenses>=4.4",
    "ruff>=0.6",
]

[project.scripts]
dc = "dronacharya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dronacharya"]

# CPU-only torch on linux/windows keeps installs small; macOS wheels on PyPI are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# correctness-focused: real errors and unused code, not style wars
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = ["E731", "B008", "B011"]   # typer uses call-defaults; asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
